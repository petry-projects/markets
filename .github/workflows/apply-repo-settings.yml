# Apply repository settings — disables check-suite auto-triggers (including
# Claude app 1236702) that permanently block auto-merge, and enforces all other
# required settings from standards/github-settings.md.
#
# Triggers:
#   • workflow_dispatch — manual run to fix current state immediately
#   • push to main on the settings script — re-applies on every future change
#   • schedule — weekly re-apply so codified rulesets self-heal live drift.
#     Without this, a ruleset that is manually changed in the GitHub UI (e.g.
#     pr-quality's require_last_push_approval flipped to false) stays drifted
#     until someone edits a script path, which is why compliance drift findings
#     recurred (#325 → #403). The apply scripts are idempotent, so re-running is
#     safe.
#
# Required secret: GH_TOKEN_ADMIN — a classic PAT or fine-grained token with
#   administration:write (repo admin) scope for petry-projects/markets.
name: Apply repo settings

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches: [main]
    paths:
      - .github/scripts/apply-repo-settings.sh
      - .github/scripts/apply-code-quality-ruleset.sh
      - .github/scripts/apply-pr-quality-ruleset.sh
      - .github/workflows/apply-repo-settings.yml

permissions: {}

jobs:
  apply-settings:
    name: Apply repo settings
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply repo settings
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_ADMIN }}
        run: bash .github/scripts/apply-repo-settings.sh
